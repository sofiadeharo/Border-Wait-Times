services:
  postgres:
    image: postgres:15-alpine
    container_name: cbp_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      POSTGRES_DB: ${DB_NAME:-border_wait_times}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cbp_network

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbp_pipeline
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-border_wait_times}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cbp_network

  weather_pipeline:
    build:
      context: .
      dockerfile: backend/weather_pipeline/Dockerfile
    container_name: weather_pipeline
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-border_wait_times}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      DB_PORT: 5432
      WEATHER_API_KEY: ${WEATHER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cbp_network

  holiday_pipeline:
    build:
      context: .
      dockerfile: backend/holiday_pipeline/Dockerfile
    container_name: holiday_pipeline
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-border_wait_times}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cbp_network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: cbp_api
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-border_wait_times}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cbp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cbp_frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cbp_network

volumes:
  postgres_data:
    driver: local

networks:
  cbp_network:
    driver: bridge
