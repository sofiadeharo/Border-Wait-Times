
services:
  postgres:
    image: postgres:15-alpine
    container_name: cbp_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      POSTGRES_DB: ${DB_NAME:-border_wait_times}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cbp_network

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbp_pipeline
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-border_wait_times}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-border_pass_2026}
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cbp_network

volumes:
  postgres_data:
    driver: local

networks:
  cbp_network:
    driver: bridge
