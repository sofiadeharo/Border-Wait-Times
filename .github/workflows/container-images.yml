# Builds the four images Azure Container Apps run and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/bwt-api | bwt-frontend | bwt-pipeline | bwt-db-init   (tags: latest + commit sha)
# Then deploy with infra/azure/deploy.sh.
name: Container images

on:
  push:
    branches: [main]
  workflow_dispatch: # run manually on any branch from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bwt-api
            context: .
            dockerfile: backend/api/Dockerfile
          - image: bwt-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: bwt-pipeline
            context: .
            dockerfile: Dockerfile
          - image: bwt-db-init
            context: .
            dockerfile: backend/database/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (registry paths must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64 # Azure Container Apps run amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
